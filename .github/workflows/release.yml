name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.1.0)'
        required: true

# Never cancel a publish mid-flight; just prevent two releases of the same version from racing on the
# main + tag push.
concurrency:
  group: release-${{ github.event.inputs.version }}
  cancel-in-progress: false

# Least privilege by default. Only create-release writes (commit + tag + release); it elevates itself.
permissions:
  contents: read

jobs:
  preflight:
    name: Validate release input
    runs-on: ubuntu-latest
    steps:
      # create-release rebases onto main and pushes, so a run dispatched from any other branch would
      # publish that branch's code and then land it on main unreviewed. Failed loudly rather than
      # skipped with a job-level `if`, which would end the run green with nothing published.
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases run from main only (dispatched from $GITHUB_REF)."
            exit 1
          fi

      - name: Validate version format
        run: |
          VERSION='${{ github.event.inputs.version }}'
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be bare semver like 1.2.0 (got '$VERSION'). Do not prefix 'v'."
            exit 1
          fi

      # Maven Central refuses to overwrite an existing version, so a duplicate would waste a full build
      # then fail at publish. Fail before anything runs.
      #
      # Queried by URL: this job has no checkout, so the old `git ls-remote ... origin` had no `origin`,
      # failed, and its failure read as "tag not found" — the check could never trip. Exit codes are
      # told apart for the same reason: 0 means the tag exists, 2 means it does not, and anything else
      # means the check itself failed, which must not pass for "safe to release".
      - name: Ensure tag does not already exist
        run: |
          VERSION='${{ github.event.inputs.version }}'
          set +e
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION" >/dev/null
          rc=$?
          set -e
          case "$rc" in
            0) echo "::error::Tag v$VERSION already exists. Bump the version."; exit 1 ;;
            2) echo "Tag v$VERSION is free." ;;
            *) echo "::error::Could not check for an existing tag (git ls-remote exited $rc)."; exit 1 ;;
          esac

  # The same gates every change is held to, run against exactly what is about to ship. Nothing
  # publishes unless they pass: a green release used to mean only "it compiled". macOS, because the
  # iOS unit tests need it.
  verify:
    name: Verify before publishing
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: API, parity and tests
        run: >-
          ./gradlew apiCheck consumerParity
          :alohomora-common:jvmTest
          :alohomora:testAndroidHostTest
          :alohomora:iosSimulatorArm64Test
          :alohomora:assembleAndroidDeviceTest
          :desktopApp:test
          --continue

  package-macos:
    name: Build macOS installers
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DMG and PKG
        run: ./gradlew :desktopApp:packageDmg :desktopApp:packagePkg -Palohomora.desktop.version=${{ inputs.version }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Alohomora-${{ inputs.version }}.dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v7
        with:
          name: Alohomora-${{ inputs.version }}.pkg
          path: desktopApp/build/compose/binaries/main/pkg/*.pkg

  build-xcframework:
    name: Build XCFramework for SPM
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build release XCFramework
        run: ./gradlew :alohomora:assembleAlohomoraKitReleaseXCFramework --no-parallel -Dorg.gradle.workers.max=1

      - name: Zip XCFramework
        run: |
          cd alohomora/build/XCFrameworks/release
          zip -r "$GITHUB_WORKSPACE/AlohomoraKit.xcframework.zip" AlohomoraKit.xcframework

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7
        with:
          name: AlohomoraKit.xcframework.zip
          path: AlohomoraKit.xcframework.zip

  publish-library:
    name: Publish to Maven Central
    needs: [ verify, package-macos, build-xcframework ]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Covers all five artifacts: the four library modules plus the Gradle plugin, which the root
      # task reaches through `gradle.includedBuild(...)`.
      - name: Publish to Maven Central
        run: ./gradlew publishMavenCentral --no-configuration-cache --no-parallel -Dorg.gradle.workers.max=1 -Palohomora.version=${{ inputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Publish plugin to Gradle Plugin Portal
        run: ./gradlew -p alohomora-gradle-plugin publishPlugins --no-configuration-cache -x signPluginMavenPublication -x signAlohomoraPluginMarkerMavenPublication -Palohomora.version=${{ inputs.version }}
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  create-release:
    name: Create GitHub Release
    needs: [ publish-library, package-macos, build-xcframework ]
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          fetch-depth: 0

      - name: Download DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: Alohomora-${{ inputs.version }}.dmg
          path: dmg

      - name: Download PKG artifact
        uses: actions/download-artifact@v8
        with:
          name: Alohomora-${{ inputs.version }}.pkg
          path: pkg

      - name: Download XCFramework artifact
        uses: actions/download-artifact@v8
        with:
          name: AlohomoraKit.xcframework.zip
          path: xcframework

      - name: Update Package.swift with checksum
        run: |
          CHECKSUM=$(sha256sum xcframework/AlohomoraKit.xcframework.zip | awk '{print $1}')
          sed -i "s|url: \".*AlohomoraKit.xcframework.zip\"|url: \"https://github.com/yashkasera/Alohomora/releases/download/v${{ inputs.version }}/AlohomoraKit.xcframework.zip\"|" Package.swift
          sed -i "s|checksum: \"[a-f0-9]*\"|checksum: \"${CHECKSUM}\"|" Package.swift

      - name: Commit, tag, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: update Package.swift for v${{ inputs.version }}"
          # main may have advanced since checkout; rebase so the push can't strand a published-but-
          # untagged release on a non-fast-forward.
          git pull --rebase origin main
          git push origin HEAD:main
          # Tag the checksummed commit itself. SPM resolves Package.swift from the tag, so the tag must
          # point at the commit carrying the matching checksum — no force-retag needed.
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: |
            dmg/*.dmg
            pkg/*.pkg
            xcframework/AlohomoraKit.xcframework.zip
