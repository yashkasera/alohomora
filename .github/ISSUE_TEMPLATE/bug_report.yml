name: Bug Report
description: Report a bug or unexpected behaviour
labels: [ bug ]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the issue.
      placeholder: |
        1. …
        2. …
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android library (alohomora)
        - iOS library (alohomora)
        - Desktop app (desktopApp)
        - Gradle plugin
        - Noop module
        - Shared UI (alohomora-ui)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Alohomora version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, device, Android/iOS version, IDE version, etc.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: text
    validations:
      required: false
