[versions]

kotlin = "2.4.10"
compose-multiplatform = "1.11.1"
# material3 ships on its own release train, so it cannot share compose-multiplatform's
# version ref — but it must stay on the SAME MINOR as ui/foundation. Pairing a 1.10.x
# material3 with 1.11.x ui/foundation risks runtime breakage across their internal APIs.
material3 = "1.11.0-alpha07"
agp = "9.2.1"
androidx-core = "1.17.0"
androidx-activityCompose = "1.13.0"
kermit = "2.1.0"
kotlinx-coroutines = "1.11.0"
kotlinx-atomicfu = "0.33.0"
ktor = "3.5.1"
kotlinx-serialization = "1.11.0"
coil = "3.5.0"
kotlinx-datetime = "0.8.0"
room = "2.8.4"
ksp = "2.3.10"
koin = "4.2.2"
androidx-navigation = "2.9.2"
sqlite = "2.7.0"
startupRuntime = "1.2.0"
okhttp = "5.3.2"
binaryCompatibilityValidator = "0.18.1"
opentelemetry = "1.51.0"
mcp = "0.15.0"
zxing = "3.5.3"

# Android instrumentation testing only. androidx-compose-ui must track whatever
# compose-multiplatform resolves to on Android — CMP 1.11.1's androidRuntimeElements point at
# androidx.compose.ui:ui:1.11.2 — because the test artifacts have no Jetbrains-published
# equivalent of ui-test-junit4 and would otherwise link against a different Compose than the
# one running in the APK.
androidx-compose-ui = "1.11.2"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.6.1"
androidx-test-rules = "1.6.1"
androidx-test-ext-junit = "1.3.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startupRuntime" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }

# Declared explicitly (not just pulled in transitively by ktor-client-okhttp) because
# :alohomora exposes okhttp3.Interceptor in its public API via TraceInterceptor.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# QR encoding for Wireless-debugging "Pair with QR code" (desktop only). Only the encoder core
# is needed — the matrix is drawn directly in a Compose Canvas, no image codec.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }

# androidx, not org.jetbrains.compose: createComposeRule()/createEmptyComposeRule() live only in
# ui-test-junit4, and createEmptyComposeRule is mandatory for the showcaseApp flow, where the
# activities involved are singleInstance/singleTask and no activity-scoped rule can span them.
# ui-test-manifest supplies the bare ComponentActivity that createComposeRule() launches into.
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "androidx-compose-ui" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidx-test-rules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
androidx-activityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }

ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }

mcp-kotlin-sdk = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "mcp" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-compose-viewmodel-navigation = { module = "io.insert-koin:koin-compose-viewmodel-navigation", version.ref = "koin" }

# OpenTelemetry — :showcaseApp only, and it has to stay that way. `Alohomora.recordSpan` takes
# strings, longs and maps, so no OTel type reaches the library; the showcase declaring this
# coordinate itself is what proves it. Adding it to :alohomora or :alohomora-noop would ship one
# vendor's SDK to every consumer. sdk-trace rather than the sdk aggregate: the aggregate also drags
# in the metrics and logs SDKs, which nothing here uses.
opentelemetry-sdk-trace = { module = "io.opentelemetry:opentelemetry-sdk-trace", version.ref = "opentelemetry" }

# Firebase Remote Config — compileOnly in :alohomora so `syncFirebaseRemoteConfig` compiles
# without shipping Firebase to consumers who don't use it. Same trade as OkHttp: consumers
# already declare the dependency themselves.
firebase-config = { module = "com.google.firebase:firebase-config", version = "23.1.0" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.32.0" }
